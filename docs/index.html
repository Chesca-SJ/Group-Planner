<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f6ee">
<meta name="description" content="Group Planner — a shared space for friends, plans, and savings goals.">
<title>Group Planner</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#f8f6ee;color:#35432e;font-family:system-ui,sans-serif}iframe{display:block;width:100%;height:100dvh;border:0;background:#f8f6ee}.loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:12px;pointer-events:none}.loading span{font-size:42px;animation:bloom 1.8s ease-in-out infinite}.loading p{font-size:16px;margin:0}@keyframes bloom{50%{transform:rotate(30deg) scale(1.15)}}@media(prefers-reduced-motion:reduce){.loading span{animation:none}}noscript{position:fixed;inset:auto 16px 16px;padding:16px;background:white;border-radius:12px}noscript a{color:inherit}
</style>
</head>
<body>
<div class="loading" id="loading" role="status"><span aria-hidden="true">✳</span><p>Opening your planner…</p></div>
<iframe id="planner" title="Group Planner" src="https://our-little-world-chesca.royal-mochi-7046.chatgpt.site" allow="clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<noscript>Group Planner needs JavaScript. <a href="https://our-little-world-chesca.royal-mochi-7046.chatgpt.site">Open the planner directly</a>.</noscript>
<script>
const frame=document.getElementById('planner');
frame.addEventListener('load',()=>document.getElementById('loading').remove(),{once:true});
</script>
</body>
</html>
